<!DOCTYPE html>
<html>
<head>
    <title>Simple Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        aside {
            width: 200px;
            height: 100vh;
            background-color: rgb(4, 0, 255);
        }

        nav {
            display: flex;
            flex-direction: column;
            border: 2px solid rgb(4, 0, 255);
            height: 500px;
        }

        nav a {
            color: rgb(255, 255, 254);
            text-decoration: none;
            padding: 20px;
            font-size: 18px;
        }

        nav a:hover {
            background-color: goldenrod;
        }

        main {
            flex: 1;
            padding: 40px;
            background-color: #abe7ef;
            color: rgb(199, 0, 199);
        }
        main h1:hover{
            background-color: #1400f4;
            color: gold;
            width: 290px;
        }

        h1 {
            margin-bottom: 15px;
        }
        main p{
            color:rgb(240, 155, 121);
        }
        nav nav{
            border: 2px solid rgb(4, 0, 255);
            height:fit-content;
        }
    </style>
</head>

<body>

    <div class="container">

        <aside>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
                <nav>
                <a href="#">Settings</a>
                <a href="#">Support</a>
                </nav>
            </nav>
           
        </aside>

        <main>
            <h1>Welcome to My Page</h1>
            <p>I Am Akash Chaudhary</p>
        </main>

    </div>

</body>
</html>
