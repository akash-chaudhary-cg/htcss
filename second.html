<!DOCTYPE html>
<html>
<head>
    <title>Simple Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        aside {
            width: 200px;
            height: 100vh;
            background-color: #222;
        }

        nav {
            display: flex;
            flex-direction: column;
            border: 4px solid rgb(38, 0, 255);
            height: 610px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 20px;
            font-size: 18px;
        }

        nav a:hover {
            background-color: #444;
        }

        main {
            flex: 1;
            padding: 40px;
            background-color: #f2f2f2;
            color: red;
        }
        main h1:hover{
            background-color: #222;
            color: gold;
            width: 350px;
        }

        h1 {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <aside>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </aside>

        <main>
            <h1>Welcome to My Page</h1>
            <p>I Am Akash Chaudhary</p>
        </main>

    </div>

</body>
</html>
